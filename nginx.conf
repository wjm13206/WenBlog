# WenBlog — Nginx server block example
# Replace server_name, root and fastcgi_pass with your own values.

server {
    listen 80;
    server_name example.com;

    root /var/www/wenblog;
    index index.php;

    charset utf-8;
    client_max_body_size 16m;

    # Private application files.
    location ~ ^/(app|config|storage)/ {
        deny all;
        return 404;
    }

    # Never execute PHP from uploads, themes or plugins.
    location ~ ^/(uploads|themes|plugins)/.*\.php$ {
        deny all;
        return 404;
    }

    # Uploaded files are static only.
    location ^~ /uploads/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The installer directory routes through the front controller.
    location = /install {
        rewrite ^ /index.php last;
    }

    # Never expose installer SQL or notes.
    location ~ ^/install/.*\.(sql|md|log|lock)$ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}